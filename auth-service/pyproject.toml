[project]
name = "auth-service"
version = "0.1.0"
description = "SIWE authentication service — hexagonal architecture"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "itsdangerous>=2.1",
    "signinwithethereum>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.3",
    "httpx>=0.27",
    "uvicorn>=0.29",
]
redis = ["redis>=5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
